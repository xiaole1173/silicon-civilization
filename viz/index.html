<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对局回放台</title>
<link rel="stylesheet" href="../web/theme.css">
<script src="../web/theme.js" defer></script>
<style>
  html,body{height:100%;overflow:hidden}
  header{gap:var(--sp-2)}
  .pick{display:flex;align-items:center;gap:var(--sp-2);margin-left:auto}
  .pick select{width:230px}
  main{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;
    height:calc(100vh - 56px);overflow:hidden}
  #left{border-right:1px solid var(--outline);background:var(--surface);
    padding:var(--sp-4);overflow:auto}
  #center{overflow:auto;padding:var(--sp-4) var(--sp-5)}
  #right{border-left:1px solid var(--outline);background:var(--surface);
    padding:var(--sp-4);overflow:auto}
  h2{font-size:var(--fs-12);color:var(--on-surface-mid);font-weight:600;margin:0 0 var(--sp-2)}
  .member{display:flex;align-items:center;gap:var(--sp-2);padding:5px 0;
    border-bottom:1px dashed var(--outline);white-space:nowrap}
  .member.out{opacity:.45}
  .member.out .nm{text-decoration:line-through}
  .nm{font-size:var(--fs-13)}
  .md{font-size:var(--fs-12);color:var(--on-surface-low);margin-left:auto}
  .seat{width:22px;height:22px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;flex:none}
  .round{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-md);
    box-shadow:var(--e1);margin:0 0 var(--sp-4);overflow:hidden}
  .round-head{display:flex;align-items:center;gap:var(--sp-2);padding:7px var(--sp-3);
    background:var(--surface-2);border-bottom:1px solid var(--outline);white-space:nowrap;overflow:hidden}
  .rt{font-size:var(--fs-13);font-weight:650}
  .rs{font-size:var(--fs-12);color:var(--on-surface-mid)}
  .rx{margin-left:auto;font-size:var(--fs-12);color:var(--brand);overflow:hidden;
    text-overflow:ellipsis;max-width:46%}
  .item{display:flex;gap:var(--sp-2);align-items:flex-start;padding:6px var(--sp-3)}
  .item+.item{border-top:1px dashed var(--outline)}
  .ibody{min-width:0;flex:1}
  .ihead{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .who{font-weight:600;font-size:var(--fs-12);white-space:nowrap}
  .role{font-size:10px;padding:0 6px;border-radius:var(--r-pill);background:var(--brand-weak);
    color:var(--brand-weak-ink);white-space:nowrap}
  .mdl{font-size:10px;color:var(--on-surface-low);white-space:nowrap}
  .lat{font-size:10px;color:var(--on-surface-low);margin-left:auto;white-space:nowrap}
  .txt{margin-top:2px;font-size:var(--fs-13);white-space:pre-wrap;word-break:break-word}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 9px;
    border-radius:var(--r-pill);background:var(--surface-3);color:var(--on-surface-mid)}
  .chip.kill{background:var(--err-weak);color:var(--err)}
  .chip.vote{background:var(--ok-weak);color:var(--ok)}
  .chip.check{background:var(--info-weak);color:var(--info)}
  .chip.badge{background:var(--warn-weak);color:var(--warn)}
  .kv{display:flex;justify-content:space-between;font-size:var(--fs-13);padding:3px 0;
    color:var(--on-surface-mid)}
  .kv b{color:var(--on-surface);font-variant-numeric:tabular-nums}
  .empty{font-size:var(--fs-12);color:var(--on-surface-low);padding:var(--sp-4) 0}
  .fail{font-size:11px;color:var(--err)}
  .spark{width:100%;height:auto;display:block}
  .spark .line{fill:none;stroke:var(--brand);stroke-width:2}
  .spark .area{fill:color-mix(in oklab, var(--brand) 12%, transparent)}
  .spark .warn{stroke:var(--err);stroke-dasharray:4 3;stroke-width:1;fill:none}
  .spark .grid{stroke:var(--outline);stroke-width:1}
  .spark text{font-size:9px;fill:var(--on-surface-low)}
</style>
</head>
<body>
<header>
  <h1>对局回放台</h1>
  <div class="pick">
    <label for="sel" style="margin:0">选择日志</label>
    <select id="sel"></select>
    <button id="play">播放</button>
    <button id="next">下一步</button>
    <button id="reset">重置</button>
  </div>
</header>

<main>
  <aside id="left">
    <h2>成员</h2>
    <div id="members"><div class="empty">—</div></div>
  </aside>
  <section id="center">
    <div id="timeline"><div class="empty">从右上角选择一局日志。</div></div>
  </section>
  <aside id="right">
    <h2>指标</h2>
    <div id="metrics"><div class="kv"><span>进度</span><b>0 / 0</b></div></div>
    <h2 style="margin-top:16px">资源池</h2>
    <div id="world"><div class="empty">本局没有资源数据</div></div>
    <h2 style="margin-top:16px">说明</h2>
    <div class="empty" style="padding-top:0">
      数据来自 runs/sessions/*.jsonl，只读回放。每张卡是一个回合，右侧是结论；动作以彩色标签显示。
    </div>
  </aside>
</main>

<script>
var S = { logs: [], data: null, step: 0, timer: null };
var PALETTE = ["#5b7cfa","#12a594","#c26a3d","#8e6bd6","#3a8fb7","#b4574f",
               "#6b8f3d","#a2568f","#4d7a9c","#8a7b3f","#5f6f8a","#a05a6b"];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function colorFor(seat){ return PALETTE[(Number(seat) - 1 + PALETTE.length) % PALETTE.length]; }
function api(u){ return fetch(u).then(function(r){ return r.json(); }); }

var KIND = { kill:["刀","kill"], vote:["票","vote"], check:["查","check"],
             poison:["毒","badge"], save:["救","badge"], guard:["守","check"],
             shoot:["开枪","kill"], pass_badge:["警徽","badge"], destruct:["自爆","badge"],
             withdraw:["退水","badge"], stay:["不退水","badge"], run:["上警","badge"],
             pass:["空过",""], abstain:["弃权",""] };

function chip(it){
  var m = KIND[it.kind];
  if (!m) return "";
  var t = (it.target !== null && it.target !== undefined && it.target !== "")
    ? " → " + esc(it.target) + " 号" : "";
  return '<span class="chip ' + m[1] + '">' + m[0] + '</span>' + t;
}

function loadLogs(){
  return api("/api/replay").then(function(d){
    S.logs = (d.logs || []).slice(0, 80).sort(function(a, b){ return b.size - a.size; });
    var sel = $("sel");
    sel.innerHTML = S.logs.map(function(l){
      var kb = Math.max(1, Math.round(l.size / 1024));
      return '<option value="' + esc(l.id) + '">' + esc(l.id) + " · " + kb + " KB</option>";
    }).join("");
    // 默认选内容最丰富的一局（小文件多为单元测试日志，没有回合）
    var want = (location.search.match(/[?&]log=([^&]+)/) || [])[1];
    var pick = null;
    if (want){
      pick = S.logs.filter(function(l){ return l.id === want; })[0];
    }
    if (!pick) pick = S.logs.filter(function(l){ return l.size > 20000; })[0] || S.logs[0];
    if (pick){
      sel.value = pick.id;
      loadViz(pick.id);
    }
  });
}

function loadViz(id){
  $("timeline").innerHTML = '<div class="empty">载入中…</div>';
  return api("/api/replay/" + encodeURIComponent(id) + "/viz").then(function(d){
    if (!d.ok){ $("timeline").innerHTML = '<div class="empty">没有这局的日志</div>'; return; }
    S.data = d; S.step = (d.rounds || []).length; render();
  });
}

function render(){
  var d = S.data; if (!d) return;
  var alive = null;
  var st = (d.states || []);
  if (st.length) alive = st[st.length - 1].alive;
  $("members").innerHTML = (d.agents || []).map(function(a){
    var out = alive && alive.indexOf(a.id) < 0;
    return '<div class="member' + (out ? " out" : "") + '">' +
      '<span class="seat" style="background:' + colorFor(a.id) + '">' + a.id + '</span>' +
      '<span class="nm">' + esc(a.name) + '</span>' +
      (a.role ? '<span class="role">' + esc(a.role) + '</span>' : "") +
      '<span class="md">' + a.actions + ' 次</span></div>';
  }).join("") || '<div class="empty">—</div>';

  var rounds = (d.rounds || []).slice(0, S.step);
  $("timeline").innerHTML = rounds.map(function(r){
    var items = (r.items || []).map(function(it){
      var txt = (it.kind && it.kind !== "speak") ? chip(it) : esc(it.text || "");
      var fail = it.failed ? '<div class="fail">调用失败</div>' : "";
      return '<div class="item">' +
        '<span class="seat" style="background:' + colorFor(it.seat) + '">' + it.seat + '</span>' +
        '<div class="ibody"><div class="ihead">' +
        '<span class="who">' + esc(it.name) + '</span>' +
        (it.role ? '<span class="role">' + esc(it.role) + '</span>' : "") +
        (it.model ? '<span class="mdl">' + esc(it.model) + '</span>' : "") +
        (it.latency_ms ? '<span class="lat">' + it.latency_ms + 'ms</span>' : "") +
        '</div><div class="txt">' + txt + "</div>" + fail + "</div></div>";
    }).join("");
    return '<div class="round"><div class="round-head">' +
      '<span class="rt">' + esc(r.title) + '</span>' +
      '<span class="rs">' + esc(r.subtitle) + '</span>' +
      '<span class="rx">' + esc(r.summary || "") + '</span>' +
      '</div>' + (items || '<div class="empty">（无动作）</div>') + "</div>";
  }).join("") || '<div class="empty">还没有回合</div>';

  renderWorld(d);
  var m = d.metrics || {};
  $("metrics").innerHTML =
    '<div class="kv"><span>进度</span><b>' + S.step + " / " + (d.rounds || []).length + '</b></div>' +
    '<div class="kv"><span>回合</span><b>' + (m.rounds || 0) + '</b></div>' +
    '<div class="kv"><span>动作</span><b>' + (m.actions || 0) + '</b></div>' +
    '<div class="kv"><span>参与者</span><b>' + (m.agents || 0) + '</b></div>' +
    ((d.final && d.final.winner) ? '<div class="kv"><span>胜方</span><b>' +
      esc(d.final.winner) + '</b></div>' : "");
}

function renderWorld(d){
  var box = $("world");
  var w = (d.world || []).filter(function(p){ return p.stock != null; });
  if (!w.length){ box.innerHTML = '<div class="empty">本局没有资源数据</div>'; return; }
  var cap = w[0].cap || Math.max.apply(null, w.map(function(p){ return p.stock; })) || 1;
  var W = 240, H = 96, pad = 6;
  var n = w.length;
  var pts = w.map(function(p, i){
    var x = pad + (W - 2 * pad) * (n === 1 ? 0.5 : i / (n - 1));
    var y = H - pad - (H - 2 * pad) * Math.max(0, Math.min(1, p.stock / cap));
    return [x, y];
  });
  var dline = pts.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var darea = dline + " L" + pts[pts.length - 1][0].toFixed(1) + "," + (H - pad) +
              " L" + pts[0][0].toFixed(1) + "," + (H - pad) + " Z";
  var warnY = H - pad - (H - 2 * pad) * 0.1;
  var last = w[w.length - 1];
  box.innerHTML =
    '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' +
    '<line class="grid" x1="' + pad + '" y1="' + warnY + '" x2="' + (W - pad) + '" y2="' + warnY + '"/>' +
    '<path class="area" d="' + darea + '"/>' +
    '<path class="line" d="' + dline + '"/>' +
    '<text x="' + pad + '" y="' + (warnY - 2) + '">10% 警戒线</text>' +
    "</svg>" +
    '<div class="kv"><span>当前存量</span><b>' + esc(last.stock) + " / " + esc(cap) + "</b></div>" +
    '<div class="kv"><span>稀缺度</span><b>' + Math.round((last.scarcity || 0) * 100) + "%</b></div>" +
    '<div class="kv"><span>采样点</span><b>' + n + "</b></div>";
}

function stop(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } $("play").textContent = "播放"; }
function play(){
  if (S.timer){ stop(); return; }
  if (!S.data) return;
  if (S.step >= S.data.rounds.length) S.step = 0;
  $("play").textContent = "暂停";
  S.timer = setInterval(function(){
    if (!S.data || S.step >= S.data.rounds.length){ stop(); return; }
    S.step++; render();
  }, 1100);
}

$("sel").onchange = function(){ stop(); loadViz($("sel").value); };
$("play").onclick = play;
$("next").onclick = function(){
  if (!S.data) return; stop();
  S.step = Math.min(S.data.rounds.length, S.step + 1); render();
};
$("reset").onclick = function(){
  stop();
  if (S.data) S.step = (S.data.rounds || []).length;
  render();
};

loadLogs();
</script>
</body>
</html>
