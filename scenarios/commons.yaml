# 公地困境：共享草场，每轮取用，草按比例恢复。稀缺度由 regen_rate（ρ）控制。
name: 公共草场
players: 6

theme:
  name: 山坳草场
  premise: |
    你们六户人家共用山坳里这片草场。草场靠天吃饭，每过一轮会长回来一些；
    但长得慢，割得狠，草场就会秃——那时谁都没得割。
    每轮你们要先当众说一句这轮打算割多少，然后真的去割。
    没有人强制你守信。

world:
  resource: 草料
  unit: 捆
  initial: 100
  cap: 100
  regen_rate: 0.05      # ρ：每轮恢复 cap 的 5%（稀缺度旋钮）
  per_round_max: 25     # 单轮取用上限
  fair_share_mode: sustainable   # sustainable：按可持续份额；equal：按人均平分

rounds: 8
declare: true           # 取用前是否公开声明

unsupported: []