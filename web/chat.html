<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多智能体会话基座</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e7eaf0; --ink:#171b23; --muted:#777f8d;
    --accent:#3b6fe0; --accent-weak:#eef3fe;
    --think:#8a7b52; --think-bg:#fdfaf2;
    --ok:#1e7e45; --err:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:6px 13px;cursor:pointer;color:var(--ink);transition:.15s;}
  button:hover{background:#f3f5f9}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#3263cc}
  input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#a9c3f5;
    box-shadow:0 0 0 3px var(--accent-weak)}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}

  header{height:56px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:10}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .pill{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:2px 10px}
  .pill b{color:var(--ink);font-weight:600}
  .spacer{flex:1}

  main{display:grid;grid-template-columns:250px minmax(0,1fr) 240px;gap:0;height:calc(100vh - 56px)}

  /* 左栏 */
  #left{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
  #left h2{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 8px;letter-spacing:.4px}
  .sess{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;
    padding:8px 10px;margin-bottom:4px;background:transparent;cursor:pointer}
  .sess:hover{background:var(--bg)}
  .sess.on{background:var(--accent-weak);border-color:#d7e3fb}
  .sess .t{font-size:13px;font-weight:600}
  .sess .s{font-size:11.5px;color:var(--muted)}

  /* 中栏 */
  #chat{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  #stream{flex:1;overflow:auto;padding:22px 26px 40px}
  .dayline{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}
  .dayline::before,.dayline::after{content:"";height:1px;background:var(--line);flex:1}
  .msg{display:flex;gap:10px;margin:0 0 16px;max-width:760px}
  .ava{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;color:#fff;
    background:#8b95a6;letter-spacing:-.5px}
  .body{min-width:0;flex:1}
  .head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .who{font-weight:650;font-size:13px}
  .meta{font-size:11.5px;color:var(--muted)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(18,24,38,.03)}
  .msg.thinking-now .bubble{border-color:#cfdcf8}
  .msg.act-msg .bubble{background:#fafbfd;color:var(--muted);font-size:12.5px;
    border-style:dashed;box-shadow:none}
  .sys{max-width:760px;margin:10px 0;font-size:12.5px;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  .sys::before{content:"";width:3px;height:14px;border-radius:2px;background:#d8dee9}
  .think{margin-top:6px;border-left:2px solid #ece4cf;background:var(--think-bg);
    border-radius:0 8px 8px 0;padding:6px 9px;font-size:12.5px;color:var(--think)}
  .think summary{cursor:pointer;list-style:none;font-size:12px;color:#9a8b62}
  .think summary::-webkit-details-marker{display:none}
  .think summary::before{content:"思考 · "}
  .think[open] summary::before{content:"收起思考 · "}
  .think .t{max-height:240px;overflow:auto;white-space:pre-wrap;margin-top:5px}
  .caret{display:inline-block;width:6px;height:13px;background:#c2a96a;border-radius:1px;
    margin-left:2px;animation:blink 1s steps(1) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}
  .errline{margin-top:6px;font-size:12px;color:var(--err)}

  #composer{border-top:1px solid var(--line);background:var(--panel);padding:10px 18px;
    display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12.5px}

  /* 右栏 */
  #right{border-left:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
  #right h2{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 8px;letter-spacing:.4px}
  .member{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #f0f2f6}
  .member:last-child{border-bottom:0}
  .member .nm{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .member .md{font-size:11px;color:var(--muted);max-width:96px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:#d5dae2;flex:none}
  .dot.on{background:var(--ok);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--muted)}
  .kv b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* 新建会话弹层 */
  #modal{position:fixed;inset:0;background:rgba(16,20,28,.32);display:none;
    align-items:center;justify-content:center;z-index:50;padding:24px}
  #modal.show{display:flex}
  .sheet{background:var(--panel);border-radius:16px;width:min(720px,100%);max-height:86vh;
    overflow:auto;padding:20px 22px;box-shadow:0 20px 50px rgba(16,24,40,.18)}
  .sheet h3{margin:0 0 14px;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
  .seatrow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .seatrow .idx{width:42px;font-size:12px;color:var(--muted)}
  .seatrow .mdl{flex:1}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .footer{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>多智能体会话基座</h1>
  <span class="pill">场景插件 <b id="pluginName">—</b></span>
  <span class="pill">消息 <b id="msgCount">0</b></span>
  <span class="pill" id="statePill">未开始</span>
  <span class="spacer"></span>
  <button class="primary" id="btnNew">新建会话</button>
</header>

<main>
  <aside id="left">
    <h2>会话</h2>
    <div id="sessList"><div class="hint">还没有会话</div></div>
  </aside>

  <section id="chat">
    <div id="stream"><div class="hint" style="padding:20px 0">新建一个会话，或从左侧选择。</div></div>
    <div id="composer"><span id="typingHint">空闲</span></div>
  </section>

  <aside id="right">
    <h2>参与者</h2>
    <div id="members"><div class="hint">—</div></div>
    <h2 style="margin-top:18px">指标</h2>
    <div id="metrics"><div class="kv"><span>消息</span><b>0</b></div></div>
  </aside>
</main>

<div id="modal">
  <div class="sheet">
    <h3>新建会话</h3>
    <div class="row">
      <div style="flex:1">
        <label>场景插件</label>
        <select id="pluginSel"></select>
      </div>
      <div style="width:180px">
        <label>标题（可选）</label>
        <input id="titleInput" placeholder="例如 圆桌讨论 1">
      </div>
    </div>
    <div id="configBox" class="grid"></div>
    <label style="margin-top:12px">参与者（座位 = 模型）</label>
    <div id="seats"></div>
    <div class="row" style="margin-top:8px">
      <button id="btnAddSeat">再加一个座位</button>
      <span class="hint" id="seatHint"></span>
    </div>
    <div class="footer">
      <button id="btnCancel">取消</button>
      <button class="primary" id="btnStart">开始</button>
    </div>
  </div>
</div>

<script>
var S = { plugins: [], models: [], sessions: [], cur: null, es: null,
          msgs: {}, agents: {}, startedAt: 0 };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function api(path, opt){
  return fetch(path, opt).then(function(r){ return r.json(); });
}
var PALETTE = ["#5b7cfa","#12a594","#c26a3d","#8e6bd6","#3a8fb7","#b4574f",
               "#6b8f3d","#a2568f","#4d7a9c","#8a7b3f","#5f6f8a","#a05a6b"];
function colorFor(seat){ return PALETTE[(Number(seat) - 1 + PALETTE.length) % PALETTE.length]; }

// ---------- 数据加载 ----------
function loadPlugins(){
  return api("/api/plugins").then(function(d){ S.plugins = d.plugins || []; renderPluginOptions(); });
}
function loadModels(){
  return api("/api/models").then(function(d){ S.models = d.models || []; });
}
function loadSessions(){
  return api("/api/sessions").then(function(d){
    S.sessions = d.sessions || [];
    $("sessList").innerHTML = S.sessions.length
      ? S.sessions.map(function(s){
          return '<button class="sess' + (S.cur === s.id ? " on" : "") + '" data-id="' + esc(s.id) + '">' +
            '<div class="t">' + esc(s.title) + '</div>' +
            '<div class="s">' + esc(s.scenario) + ' · ' + s.messages + ' 条 · ' + esc(stateText(s.state)) + '</div></button>';
        }).join("")
      : '<div class="hint">还没有会话</div>';
  });
}

// ---------- 新建会话 ----------
function renderPluginOptions(){
  $("pluginSel").innerHTML = S.plugins.map(function(p){
    return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
  }).join("");
  renderConfig();
  renderSeats(3);
}
function currentPlugin(){
  var id = $("pluginSel").value;
  return S.plugins.filter(function(p){ return p.id === id; })[0];
}
function renderConfig(){
  var p = currentPlugin();
  var box = $("configBox");
  if (!p || !p.default_config){ box.innerHTML = ""; return; }
  box.innerHTML = Object.keys(p.default_config).map(function(k){
    var v = p.default_config[k];
    var type = typeof v === "number" ? "number" : "text";
    return '<div><label>' + esc(k) + '</label><input data-cfg="' + esc(k) + '" type="' + type +
      '" value="' + esc(v) + '"></div>';
  }).join("");
}
function modelOptions(selected){
  if (!S.models.length) return '<option value="">（先在模型管理里添加模型）</option>';
  return S.models.map(function(m){
    return '<option value="' + esc(m.id) + '"' + (m.id === selected ? " selected" : "") + '>' +
      esc(m.name) + ' · ' + esc(m.protocol) + '</option>';
  }).join("");
}
function renderSeats(n){
  var box = $("seats");
  var keep = box.querySelectorAll("select").length;
  if (keep === n) return;
  box.innerHTML = "";
  for (var i = 1; i <= n; i++){
    var div = document.createElement("div");
    div.className = "seatrow";
    div.innerHTML = '<span class="idx">' + i + ' 号</span>' +
      '<select class="mdl">' + modelOptions() + '</select>';
    box.appendChild(div);
  }
}
function openModal(){
  $("modal").classList.add("show");
  var p = currentPlugin();
  if (p) $("titleInput").value = p.name;
}
function closeModal(){ $("modal").classList.remove("show"); }

function startSession(){
  var p = currentPlugin();
  if (!p){ alert("还没有插件"); return; }
  var config = {};
  Array.prototype.forEach.call(document.querySelectorAll("[data-cfg]"), function(el){
    var v = el.value;
    config[el.getAttribute("data-cfg")] = (el.type === "number") ? Number(v) : v;
  });
  var seats = [];
  Array.prototype.forEach.call(document.querySelectorAll("#seats .mdl"), function(sel, i){
    seats.push({ model_id: sel.value, name: (i + 1) + "号" });
  });
  if (seats.some(function(s){ return !s.model_id; })){
    alert("每个座位都要选模型"); return;
  }
  $("btnStart").disabled = true;
  api("/api/sessions", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ plugin: p.id, config: config, seats: seats,
                           title: $("titleInput").value || p.name })
  }).then(function(d){
    $("btnStart").disabled = false;
    if (!d.ok){ alert(d.error || "创建失败"); return; }
    closeModal();
    attach(d.session.id);
    loadSessions();
  }).catch(function(){ $("btnStart").disabled = false; alert("请求失败"); });
}

// ---------- 聊天流 ----------
function attach(sid){
  if (S.es){ S.es.close(); S.es = null; }
  S.cur = sid; S.msgs = {}; S.agents = {}; S.startedAt = Date.now();
  $("stream").innerHTML = "";
  var es = new EventSource("/api/sessions/" + encodeURIComponent(sid) + "/stream");
  S.es = es;
  es.onmessage = function(ev){
    var data;
    try { data = JSON.parse(ev.data); } catch (e) { return; }
    handleEvent(data);
  };
  es.onerror = function(){ /* 浏览器会自动重连 */ };
  loadSessions();
}

// 静态模式：不连 SSE，直接拉快照渲染（用于截图/回看）
function attachStatic(sid){
  S.cur = sid; S.msgs = {}; S.agents = {};
  $("stream").innerHTML = "";
  return api("/api/sessions/" + encodeURIComponent(sid)).then(function(d){
    if (!d.ok){ $("stream").innerHTML = '<div class="hint">会话不存在</div>'; return; }
    var s = d.session;
    $("pluginName").textContent = s.scenario || "—";
    (s.agents || []).forEach(function(a){ S.agents[a.id] = a; });
    renderMembers(); setState(s.state, s.winner);
    (s.messages || []).forEach(function(m){
      addBubble(m);
      var node = S.msgs[m.id];
      if (!node) return;
      node.text.textContent = m.text || "";
      node.think.textContent = m.thinking || "";
      node.thinkBox.style.display = (m.thinking || "").trim() ? "block" : "none";
      node.root.classList.remove("thinking-now");
      node.status.textContent = "";
      if (m.meta && m.meta.usage){
        node.usage = m.meta.usage;
        node.meta.textContent = (m.meta.latency_ms || 0) + "ms · " +
          (m.meta.usage.prompt_tokens || 0) + "→" + (m.meta.usage.completion_tokens || 0) + " tok";
      }
    });
    updateMetrics();
    scrollBottom();
  });
}

function handleEvent(e){
  if (e.type === "snapshot"){
    $("pluginName").textContent = e.scenario || "—";
    (e.agents || []).forEach(function(a){ S.agents[a.id] = a; });
    renderMembers();
    setState(e.state);
    return;
  }
  if (e.type === "message_start"){
    var m = e.message;
    if (S.msgs[m.id]) return;
    addBubble(m);
    return;
  }
  if (e.type === "delta"){
    var node = S.msgs[e.id];
    if (!node) return;
    if (e.field === "thinking"){
      node.think.textContent += e.text;
      node.thinkBox.style.display = "block";
      node.thinkBox.open = true;
      node.status.textContent = "正在思考";
    } else {
      node.text.textContent += e.text;
      node.status.textContent = "正在说话";
    }
    scrollBottom();
    return;
  }
  if (e.type === "message_end"){
    var n = S.msgs[e.id];
    if (!n) return;
    n.text.textContent = e.text || "";
    n.think.textContent = e.thinking || "";
    n.thinkBox.style.display = (e.thinking || "").trim() ? "block" : "none";
    n.status.textContent = "";
    n.root.classList.remove("thinking-now");
    if (e.meta && e.meta.error){
      var err = document.createElement("div");
      err.className = "errline";
      err.textContent = "调用失败：" + e.meta.error;
      n.body.appendChild(err);
    }
    if (e.meta && e.meta.usage){
      n.usage = e.meta.usage;
      n.meta.textContent = (e.meta.latency_ms || 0) + "ms · " +
        (e.meta.usage.prompt_tokens || 0) + "→" + (e.meta.usage.completion_tokens || 0) + " tok";
    }
    updateMetrics();
    scrollBottom();
    return;
  }
  if (e.type === "validation_failed"){
    var vn = S.msgs[e.id];
    if (vn){
      var tip = document.createElement("div");
      tip.className = "errline";
      tip.style.color = "#b45309";
      tip.textContent = "校验未通过：" + (e.reason || "") + "（要求重说）";
      vn.body.appendChild(tip);
    }
    return;
  }
  if (e.type === "context_trim"){
    $("typingHint").textContent = "上下文已裁剪 " + e.trimmed + " 条（" + e.prompt_chars + " 字）";
    return;
  }
  if (e.type === "turn"){
    if (e.state === "restart" && e.id && S.msgs[e.id]){
      // 重试：清空这一条重来，而不是让两段拼在一起
      S.msgs[e.id].text.textContent = "";
      S.msgs[e.id].think.textContent = "";
      S.msgs[e.id].status.textContent = "重新生成";
    }
    var a = S.agents[e.agent];
    $("typingHint").textContent = e.state === "start"
      ? ("正在等待 " + (a ? a.name : (e.agent + "号")) + " 回应…")
      : "空闲";
    if (a){
      var dot = document.querySelector('[data-agent-dot="' + e.agent + '"]');
      if (dot) dot.classList.toggle("on", e.state === "start");
    }
    return;
  }
  if (e.type === "session"){
    setState(e.state, e.winner);
    $("typingHint").textContent = e.state === "ended" ? "会话已结束" : "空闲";
    updateMetrics();
    return;
  }
}

function addBubble(m){
  var stream = $("stream");
  if (m.kind === "system"){
    var d = document.createElement("div");
    d.className = "sys";
    d.textContent = m.text || "";
    stream.appendChild(d);
    scrollBottom();
    return;
  }
  var root = document.createElement("div");
  root.className = "msg thinking-now" + (m.kind === "action" ? " act-msg" : "");
  root.innerHTML =
    '<div class="ava" style="background:' + colorFor(m.sender) + '">' + esc(m.sender) + '</div>' +
    '<div class="body">' +
      '<div class="head"><span class="who">' + esc(m.sender_name) + '</span>' +
      '<span class="meta"></span><span class="meta status"></span></div>' +
      '<div class="bubble"><span class="text"></span></div>' +
      '<details class="think" style="display:none"><summary></summary><div class="t"></div></details>' +
    '</div>';
  stream.appendChild(root);
  var node = {
    root: root,
    text: root.querySelector(".text"),
    think: root.querySelector(".think .t"),
    thinkBox: root.querySelector(".think"),
    status: root.querySelector(".status"),
    meta: root.querySelector(".meta"),
    body: root.querySelector(".body"),
  };
  S.msgs[m.id] = node;
  $("msgCount").textContent = Object.keys(S.msgs).length;
  scrollBottom();
}

function renderMembers(){
  var ids = Object.keys(S.agents);
  $("members").innerHTML = ids.length ? ids.map(function(id){
    var a = S.agents[id];
    return '<div class="member">' +
      '<span class="dot" data-agent-dot="' + id + '"></span>' +
      '<span class="ava" style="width:22px;height:22px;border-radius:7px;font-size:11px;background:' +
        colorFor(id) + '">' + id + '</span>' +
      '<span class="nm">' + esc(a.name) + '</span>' +
      '<span class="md">' + esc(a.model) + '</span></div>';
  }).join("") : '<div class="hint">—</div>';
}

function updateMetrics(){
  var n = Object.keys(S.msgs).length;
  $("msgCount").textContent = n;
  var pin = 0, pout = 0, pcached = 0;
  Object.keys(S.msgs).forEach(function(id){
    var meta = S.msgs[id] && S.msgs[id].usage;
    if (!meta) return;
    pin += meta.prompt_tokens || 0;
    pout += meta.completion_tokens || 0;
    pcached += (meta.prompt_tokens_details && meta.prompt_tokens_details.cached_tokens) || 0;
  });
  $("metrics").innerHTML =
    '<div class="kv"><span>消息</span><b>' + n + '</b></div>' +
    '<div class="kv"><span>参与者</span><b>' + Object.keys(S.agents).length + '</b></div>' +
    '<div class="kv"><span>输入 tok</span><b>' + pin + '</b></div>' +
    '<div class="kv"><span>输出 tok</span><b>' + pout + '</b></div>' +
    '<div class="kv"><span>命中缓存</span><b>' + pcached + '</b></div>';
}

function stateText(state){
  var map = { created: "准备中", running: "进行中", ended: "已结束", closed: "已关闭" };
  return map[state] || state;
}
function setState(state, winner){
  $("statePill").innerHTML = "状态 <b>" + stateText(state) + "</b>" +
    (winner ? " · 胜方 <b>" + esc(winner) + "</b>" : "");
}

function scrollBottom(){
  var el = $("stream");
  el.scrollTop = el.scrollHeight;
}

// ---------- 绑定 ----------
$("btnNew").onclick = openModal;
$("btnCancel").onclick = closeModal;
$("btnStart").onclick = startSession;
$("pluginSel").onchange = function(){ renderConfig(); };
$("btnAddSeat").onclick = function(){ renderSeats(document.querySelectorAll("#seats .mdl").length + 1); };
$("sessList").onclick = function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-id]") : null;
  if (!t) return;
  attach(t.getAttribute("data-id"));
};

loadPlugins().then(loadModels).then(loadSessions).then(function(){
  if (S.models.length === 0) $("seatHint").textContent = "先在「模型管理」页添加模型";
  var q = new URLSearchParams(location.search);
  var want = q.get("session");
  if (want){ q.has("static") ? attachStatic(want) : attach(want); }
});
setInterval(function(){ if (!S.es) loadSessions(); }, 4000);
</script>
</body>
</html>
