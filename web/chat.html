<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多智能体会话基座</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>
<style>
  /* 局部别名：全部指向 theme.css 的令牌，页面内不再出现硬编码色值 */
  :root{
    --panel: var(--surface);
    --line: var(--outline);
    --ink: var(--on-surface);
    --muted: var(--on-surface-mid);
    --accent: var(--brand);
    --accent-weak: var(--brand-weak);
    --think: var(--warn);
    --think-bg: var(--warn-weak);
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  button{font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);
    padding:6px 13px;cursor:pointer;color:var(--ink);transition:.15s;}
  button:hover{background:var(--surface-3)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  button.primary:hover{background:var(--brand-hover)}
  input,select{font:inherit;border:1px solid var(--line);border-radius:var(--r-sm);
    padding:7px 10px;background:var(--surface);color:var(--ink);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-weak)}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}

  header{height:56px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 18px;position:relative;z-index:10}
  header h1{font-size:15px;margin:0;font-weight:650}
  .pill{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:var(--r-pill);padding:2px 10px}
  .pill b{color:var(--ink);font-weight:600}
  .spacer{flex:1}

  #banner{display:none;padding:7px 18px;background:var(--warn-weak);color:var(--warn);font-size:12.5px;
    border-bottom:1px solid var(--outline-strong)}
  #banner.show{display:block}

  main{display:grid;grid-template-columns:236px minmax(0,1fr) 272px;
    height:calc(100vh - 56px);overflow:hidden}

  /* 左栏 */
  #left{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
  #left h2,#right h2{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 8px}
  .sess{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:var(--r-sm);
    padding:8px 10px;margin-bottom:4px;background:transparent;cursor:pointer}
  .sess:hover{background:var(--bg)}
  .sess.on{background:var(--accent-weak);border-color:var(--outline)}
  .sess .t{font-size:13px;font-weight:600}
  .sess .s{font-size:11.5px;color:var(--muted)}
  .sesswrap{position:relative}
  .stopbtn{position:absolute;right:6px;top:8px;font-size:10.5px;padding:1px 7px;
    border-radius:var(--r-pill);color:var(--err);background:var(--surface);border-color:var(--err-weak);display:none}
  .sesswrap:hover .stopbtn{display:block}

  /* 中栏 */
  #chat{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  #stream{flex:1;overflow:auto;padding:18px 22px 30px}

  /* 裁判 */
  .ref{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:9px 12px;
    background:var(--surface-3);border-radius:var(--r-sm);color:var(--on-surface);font-size:13px}
  .ref .who{flex:none;font-weight:700;font-size:12px;color:var(--on-surface-mid);
    border-right:1px solid var(--outline);padding-right:10px}
  .ref.private{background:var(--warn-weak);color:var(--warn)}
  .ref.private .who{color:var(--warn);border-color:var(--outline-strong)}

  /* 回合卡 */
  .round{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);
    margin:16px 0;overflow:hidden}
  .round-head{display:flex;align-items:center;gap:9px;padding:8px 13px;
    background:var(--surface-2);border-bottom:1px solid var(--line)}
  .round-head .rt,.round-head .rs,.round-head .chbadge{white-space:nowrap}
  .round-head .rx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .round-head .rt{font-size:13px;font-weight:650}
  .round-head .rs{font-size:11.5px;color:var(--muted)}
  .round-head .rx{margin-left:auto;font-size:11.5px;color:var(--brand);font-variant-numeric:tabular-nums}
  .round-body{padding:10px 13px}
  .round{box-shadow:var(--e1)}
  .round.secret{border-color:var(--outline);background:var(--surface-2)}
  .round.secret .round-head{background:var(--surface-2)}
  .round.secret .rt{color:var(--info)}
  .round.public{border-color:var(--line)}
  .round.wolves{border-color:var(--outline-strong)}
  .round.wolves .round-head{background:var(--brand-weak)}
  .round.wolves .rt{color:var(--warn)}

  /* 回合内条目 */
  .item{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
  .item + .item{border-top:1px dashed var(--surface-3)}
  .seat{flex:none;width:24px;height:24px;border-radius:8px;color:var(--surface);font-size:11.5px;
    font-weight:700;display:flex;align-items:center;justify-content:center}
  .ibody{min-width:0;flex:1}
  .ihead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .who{font-weight:600;font-size:12.5px}
  .role{font-size:10px;padding:0 6px;border-radius:var(--r-pill);background:var(--brand-weak);color:var(--brand-weak-ink);white-space:nowrap}
  .mdl{font-size:10.5px;color:var(--on-surface-low)}
  .lat{font-size:10.5px;color:var(--on-surface-low);margin-left:auto}
  .itext{margin-top:2px;white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--on-surface)}
  .votes{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .round.votebox .round-body{padding:8px 13px}
  .chbadge{font-size:10.5px;padding:1px 7px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--on-surface-mid)}
  .chbadge.wolves{background:var(--warn-weak);color:var(--warn)}
  .chbadge.secret{background:var(--info-weak);color:var(--info)}
  .chbadge.vote{background:var(--ok-weak);color:var(--ok)}
  .chbadge.public{background:var(--surface-3);color:var(--on-surface-mid)}
  .vthink{margin-top:7px;border-top:1px dashed var(--surface-3);padding-top:6px}
  .vt{font-size:11.5px;color:var(--think);white-space:pre-wrap;margin:3px 0;
    max-height:120px;overflow:auto}
  button.tiny{font-size:11px;padding:1px 8px;border-radius:var(--r-pill);color:var(--on-surface-mid)}
  .fail{font-size:11.5px;color:var(--err);margin-top:3px}
  .vchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;
    border-radius:var(--r-pill);background:var(--surface-3);color:var(--on-surface-mid)}
  .vchip b{font-variant-numeric:tabular-nums}
  .abstain{color:var(--on-surface-low)}
  .think{margin-top:5px;border-left:2px solid var(--outline-strong);background:var(--think-bg);
    border-radius:0 8px 8px 0;padding:5px 9px;font-size:12px;color:var(--think)}
  .think summary{cursor:pointer;list-style:none;font-size:11.5px;color:var(--warn)}
  .think summary::-webkit-details-marker{display:none}
  .think summary::before{content:"思考"}
  .think .t{max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:4px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px;
    padding:1px 9px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--on-surface-mid)}
  .chip.kill{background:var(--err-weak);color:var(--err)}
  .chip.check{background:var(--info-weak);color:var(--info)}
  .chip.poison{background:var(--warn-weak);color:var(--warn)}
  .chip.vote{background:var(--ok-weak);color:var(--ok)}
  .chip.badge{background:var(--warn-weak);color:var(--warn)}

  .errline{font-size:11.5px;color:var(--warn);margin-top:3px}

  #composer{border-top:1px solid var(--line);background:var(--panel);padding:9px 18px;
    color:var(--muted);font-size:12.5px}

  /* 右栏 */
  #right{border-left:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
  .member{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--outline);white-space:nowrap}
  .member.out{opacity:.5}
  .member.out .nm{text-decoration:line-through}
  .member .nm{font-size:12.5px}
  .member .md{font-size:10.5px;color:var(--muted);margin-left:auto;max-width:88px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;padding:0 5px;border-radius:var(--r-pill);background:var(--warn-weak);color:var(--warn);white-space:nowrap}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--muted)}
  .kv b{color:var(--ink);font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:var(--muted)}

  /* 弹层 */
  #modal{position:fixed;inset:0;background:rgba(16,20,28,.32);display:none;
    align-items:center;justify-content:center;z-index:50;padding:24px}
  #modal.show{display:flex}
  .sheet{background:var(--panel);border-radius:var(--r-lg);width:min(760px,100%);max-height:86vh;
    overflow:auto;padding:20px 22px;box-shadow:var(--e2)}
  .sheet h3{margin:0 0 14px;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
  .seatrow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;margin-bottom:7px}
  .footer{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>多智能体会话基座</h1>
  <span class="pill">场景 <b id="pluginName">—</b></span>
  <span class="pill">消息 <b id="msgCount">0</b></span>
  <span class="pill" id="statePill">未开始</span>
  <span class="spacer"></span>
  <button id="ttsBtn" title="语音播报裁判与发言">播报：关</button>
  <button class="primary" id="btnNew">新建会话</button>
</header>
<div id="banner"></div>

<main>
  <aside id="left">
    <h2>会话</h2>
    <div id="sessList"><div class="hint">还没有会话</div></div>
    <h2 style="margin-top:16px">历史回放</h2>
    <div id="replayList"><div class="hint">—</div></div>
  </aside>
  <section id="chat">
    <div id="stream"><div class="hint" style="padding:20px 0">新建一个会话，或从左侧选择。</div></div>
    <div id="composer"><span id="typingHint">空闲</span></div>
  </section>
  <aside id="right">
    <h2>参与者</h2>
    <div id="members"><div class="hint">—</div></div>
    <h2 style="margin-top:16px">指标</h2>
    <div id="metrics"><div class="kv"><span>消息</span><b>0</b></div></div>
  </aside>
</main>

<div id="modal">
  <div class="sheet">
    <h3>新建会话</h3>
    <div class="row">
      <div style="flex:1"><label>场景插件</label><select id="pluginSel"></select></div>
      <div style="width:190px"><label>标题（可选）</label><input id="titleInput"></div>
    </div>
    <div id="configBox" class="grid"></div>
    <label style="margin-top:12px">参与者（每个座位一个模型）</label>
    <div id="seats"></div>
    <div class="row" style="margin-top:8px">
      <button id="btnAddSeat">再加一个座位</button>
      <span class="hint" id="seatHint"></span>
    </div>
    <div class="footer">
      <button id="btnCancel">取消</button>
      <button class="primary" id="btnStart">开始</button>
    </div>
  </div>
</div>

<script>
var S = { plugins: [], models: [], sessions: [], cur: null, es: null,
          msgs: {}, rounds: {}, roundMeta: {}, agents: {}, stick: true, retry: 0,
          alive: null, sheriff: null, revealed: [] };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function api(path, opt){ return fetch(path, opt).then(function(r){ return r.json(); }); }

var PALETTE = ["#5b7cfa","#12a594","#c26a3d","#8e6bd6","#3a8fb7","#b4574f",
               "#6b8f3d","#a2568f","#4d7a9c","#8a7b3f","#5f6f8a","#a05a6b"];
function colorFor(seat){ return PALETTE[(Number(seat) - 1 + PALETTE.length) % PALETTE.length]; }

/* ---------- 通用 ---------- */
function banner(text){
  var el = $("banner");
  el.className = text ? "show" : "";
  el.textContent = text || "";
}
function nearBottom(){
  var el = $("stream");
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}
function scrollBottom(force){
  var el = $("stream");
  if (force || S.stick) el.scrollTop = el.scrollHeight;
}
function stateText(st){
  return { created:"准备中", running:"进行中", ending:"正在结束", ended:"已结束",
           closed:"已关闭", stopped:"已停止" }[st] || st;
}
function setState(st, winner){
  $("statePill").innerHTML = "状态 <b>" + stateText(st) + "</b>" +
    (winner ? " · 胜方 <b>" + esc(winner) + "</b>" : "");
}

/* ---------- 渲染：裁判 / 回合 / 条目 ---------- */
function addReferee(m){
  var d = document.createElement("div");
  d.className = "ref" + (m.channel === "meta" ? " private" : "");
  d.innerHTML = '<span class="who">裁判</span><span class="txt"></span>';
  d.querySelector(".txt").textContent = m.text || "";
  $("stream").appendChild(d);
  scrollBottom();
}

function createRound(rnd){
  if (rnd && rnd.id && S.rounds[rnd.id]) return S.rounds[rnd.id];   // 幂等：同一回合只建一张卡
  var box = document.createElement("div");
  box.className = "round" + (rnd.channel === "wolves" ? " wolves" : "") +
    (rnd.kind === "vote" ? " votebox" : "");
  box.innerHTML = '<div class="round-head"><span class="rt"></span>' +
    '<span class="rs"></span><span class="rx"></span></div>' +
    '<div class="round-body"></div>';
  box.querySelector(".rt").textContent = rnd.title || "";
  box.querySelector(".rs").textContent = rnd.subtitle || "";
  var badge = { wolves: "狼队频道", secret: "私密 · 仅观察者", vote: "计票", public: "公开" }[rnd.kind || ""];
  if (badge){
    var b = document.createElement("span");
    b.className = "chbadge " + (rnd.kind || "");
    b.textContent = badge;
    box.querySelector(".round-head").insertBefore(b, box.querySelector(".rs"));
  }
  if (rnd.kind === "vote"){
    var tb = document.createElement("button");
    tb.className = "tiny";
    tb.textContent = "思考";
    tb.onclick = function(){
      var vt = S.rounds[rnd.id] && S.rounds[rnd.id].vthink;
      if (!vt) return;
      vt.style.display = vt.style.display === "none" ? "block" : "none";
    };
    box.querySelector(".round-head").insertBefore(tb, box.querySelector(".rx"));
  }
  $("stream").appendChild(box);
  var obj = { root: box, body: box.querySelector(".round-body"),
              summary: box.querySelector(".rx"), items: {}, kind: rnd.kind || "group",
              votes: null };
  S.rounds[rnd.id] = obj;
  scrollBottom();
  return obj;
}
var KIND_BY_TITLE = {
  "狼队密谋":"wolves", "狼人猎杀":"secret", "预言家查验":"secret", "女巫用药":"secret",
  "守卫行动":"secret", "猎人开枪":"secret", "白狼王反制":"secret", "狼王反制":"secret",
  "自爆声明":"secret",
  "警长竞选":"vote", "上警":"vote", "退水":"vote", "警下投票":"vote", "PK 重投":"vote",
  "平票重投":"vote", "全体表决":"vote", "警徽移交":"vote",
  "白天陈述":"public", "遗言":"public", "竞选发言":"public", "PK 发言":"public"
};
function ensureRound(id, meta){
  if (!id) return null;
  if (S.rounds[id]) return S.rounds[id];
  var info = meta || S.roundMeta[id] || { id: id, title: "" };
  if (!info.kind && KIND_BY_TITLE[info.title]) info = Object.assign({}, info, { kind: KIND_BY_TITLE[info.title] });
  var rd = createRound(info);
  // 刷新后 round_end 事件不会重放：从快照里补回结论
  if (rd && info.summary && rd.summary && !rd.summary.textContent){
    rd.summary.textContent = info.summary;
  }
  return rd;
}

var CHIP = { kill:{c:"kill",l:"刀"}, check:{c:"check",l:"查"}, poison:{c:"poison",l:"毒"},
             save:{c:"poison",l:"救"}, guard:{c:"check",l:"守"}, vote:{c:"vote",l:"票"},
             shoot:{c:"kill",l:"开枪"}, pass_badge:{c:"badge",l:"警徽"},
             destruct:{c:"badge",l:"自爆"}, destroy:{c:"badge",l:"作废"},
             abstain:{c:"",l:"弃权"}, pass:{c:"",l:"空过"} };
function chipHtml(action){
  if (!action) return "";
  var c = CHIP[action.kind] || { c:"", l: action.kind || "" };
  var t = (action.target !== undefined && action.target !== null && action.target !== "")
    ? ' → <b>' + esc(action.target) + '</b> 号' : "";
  return '<span class="chip ' + c.c + '">' + esc(c.l) + '</span>' + t;
}

var VOTE_LIKE = { day_vote:1, sheriff_vote:1 };
function addItem(roundId, m){
  var rd = ensureRound(roundId);
  if (!rd) return null;
  if (rd.kind === "vote") return addVote(rd, m);
  var role = (m.meta && m.meta.role) ? '<span class="role">' + esc(m.meta.role) + '</span>' : "";
  var model = (m.meta && m.meta.model) ? '<span class="mdl">' + esc(m.meta.model) + '</span>' : "";
  var row = document.createElement("div");
  row.className = "item";
  row.innerHTML =
    '<span class="seat" style="background:' + colorFor(m.sender) + '">' + esc(m.sender) + '</span>' +
    '<div class="ibody">' +
      '<div class="ihead"><span class="who">' + esc(m.sender_name) + '</span>' + role + model +
      '<span class="lat"></span></div>' +
      '<div class="c"></div>' +
      '<details class="think" style="display:none"><summary></summary><div class="t"></div></details>' +
    '</div>';
  rd.body.appendChild(row);
  var node = { root: row, text: row.querySelector(".c"), body: row.querySelector(".ibody"),
               think: row.querySelector(".think .t"), thinkBox: row.querySelector(".think"),
               lat: row.querySelector(".lat") };
  S.msgs[m.id] = node;
  scrollBottom();
  return node;
}

function addVote(rd, m){
  if (!rd.votes){
    rd.votes = document.createElement("div");
    rd.votes.className = "votes";
    rd.body.appendChild(rd.votes);
    rd.vthink = document.createElement("div");
    rd.vthink.className = "vthink";
    rd.vthink.style.display = "none";
    rd.body.appendChild(rd.vthink);
  }
  var chip = document.createElement("span");
  chip.className = "vchip";
  chip.innerHTML = '<span class="seat" style="width:16px;height:16px;border-radius:5px;' +
    'font-size:9.5px;background:' + colorFor(m.sender) + '">' + esc(m.sender) + '</span>' +
    '<span class="c"></span>';
  rd.votes.appendChild(chip);
  var node = { root: chip, text: chip.querySelector(".c"), body: rd.votes,
               think: document.createElement("span"), thinkBox: {style:{}, open:false},
               lat: document.createElement("span"), round: rd, sender: m.sender,
               senderName: m.sender_name };
  S.msgs[m.id] = node;
  return node;
}

function addMessage(m){
  if (m.kind === "referee" || m.kind === "system"){ addReferee(m); return; }
  var node = m.round ? addItem(m.round, m) : addItem(null, m);
  if (!node && !m.round){
    // 没有回合归属的自由消息：单独一条
    node = addItem("__solo", m);
  }
}

function finalize(node, text, thinking, meta){
  if (!node) return;
  var isVote = !!(node.root && node.root.classList && node.root.classList.contains("vchip"));
  if (isVote){
    // 思考只记一次（patch_message 会重复发 message_end）
    if (thinking && thinking.trim() && !node.thinkDone && node.round && node.round.vthink){
      var t = document.createElement("div");
      t.className = "vt";
      t.innerHTML = '<b>' + esc(node.senderName || node.sender) + '</b>：';
      t.appendChild(document.createTextNode(thinking.trim()));
      node.round.vthink.appendChild(t);
      node.thinkDone = true;
    }
    var a = (meta && meta.action) || {};
    var KIND_LABEL = { run: "上警", pass: "不上警", withdraw: "退水", stay: "不退水",
                       destruct: "自爆", destroy: "作废", save: "救", poison: "毒",
                       guard: "守", check: "查", kill: "刀", shoot: "开枪" };
    if (a.target){
      node.text.textContent = "→ " + a.target;
    } else if (a.kind === "vote" || a.kind === "abstain"){
      node.text.textContent = "弃权";
      node.root.classList.add("abstain");
    } else if (KIND_LABEL[a.kind]){
      node.text.textContent = KIND_LABEL[a.kind];
    } else if (meta && (meta.rejections || []).length){
      node.text.textContent = "格式错误";
      node.root.classList.add("abstain");
      node.root.title = meta.rejections[0];
    } else {
      node.text.textContent = "未表态";
      node.root.classList.add("abstain");
    }
    if (meta && meta.rejections && meta.rejections.length){
      node.root.title = "重说 " + meta.rejections.length + " 次：" + meta.rejections[0];
    }
  } else if (meta && meta.action && meta.action.kind && meta.action.kind !== "speak"){
    node.text.innerHTML = chipHtml(meta.action);
  } else {
    node.text.textContent = text || "";
  }
  if (thinking && thinking.trim()){
    node.think.textContent = thinking;
    node.thinkBox.style.display = "block";
    node.thinkBox.open = false;
  }
  if (meta && meta.usage){
    node.lat.textContent = (meta.latency_ms || 0) + "ms";
  } else if (meta && meta.latency_ms){
    node.lat.textContent = meta.latency_ms + "ms";
  }
}

/* ---------- 渲染：成员 / 指标 ---------- */
function renderMembers(){
  var ids = Object.keys(S.agents);
  $("members").innerHTML = ids.length ? ids.map(function(id){
    var a = S.agents[id];
    var isAlive = !S.alive || S.alive.indexOf(Number(id)) >= 0;
    var tags = "";
    if (String(S.sheriff) === String(id)) tags += '<span class="tag">警长</span>';
    if ((S.revealed || []).indexOf(Number(id)) >= 0) tags += '<span class="tag">翻牌</span>';
    return '<div class="member' + (isAlive ? '' : ' out') + '">' +
      '<span class="seat" style="width:20px;height:20px;border-radius:6px;font-size:10.5px;background:' +
        colorFor(id) + '">' + id + '</span>' +
      '<span class="nm">' + esc(a.name) + '</span>' +
      (a.role ? '<span class="role">' + esc(a.role) + '</span>' : '') + tags +
      '<span class="md">' + esc(a.model || '') + '</span></div>';
  }).join("") : '<div class="hint">—</div>';
}

function updateMetrics(){
  var n = Object.keys(S.msgs).length;
  $("msgCount").textContent = n;
  var pin = 0, pout = 0;
  Object.keys(S.msgs).forEach(function(id){
    var u = S.msgs[id] && S.msgs[id].usage;
    if (!u) return;
    pin += u.prompt_tokens || 0; pout += u.completion_tokens || 0;
  });
  var rows = [
    ["回合", Object.keys(S.rounds).length],
    ["消息", n],
    ["参与者", Object.keys(S.agents).length],
    ["输入 tok", pin],
    ["输出 tok", pout]
  ];
  var m = S.sessionMetrics || {};
  Object.keys(m).slice(0, 6).forEach(function(k){
    var v = m[k];
    rows.push([k.replace(/^m_/, ""), (typeof v === "number" ? v : String(v))]);
  });
  if (S.reputation && Object.keys(S.reputation).length){
    rows.push(["声誉", Object.keys(S.reputation).map(function(k){
      return k + ":" + S.reputation[k]; }).join(" ")]);
  }
  $("metrics").innerHTML = rows.map(function(r){
    return '<div class="kv"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>';
  }).join("");
}

/* ---------- 事件 ---------- */
/* ---------- TTS 播报 ---------- */
var TTS = { on: false, queue: [], playing: false };

function ttsInit(){
  try { TTS.on = localStorage.getItem("dsh-tts") === "1"; } catch (err) {}
  var btn = $("ttsBtn");
  if (btn) btn.textContent = "播报：" + (TTS.on ? "开" : "关");
}

function ttsSay(text){
  if (!TTS.on || !text) return;
  var t = String(text).replace(/\s+/g, " ").trim();
  if (!t) return;
  TTS.queue.push(t.slice(0, 120));
  if (TTS.queue.length > 6) TTS.queue.shift();
  ttsPump();
}

function ttsPump(){
  if (TTS.playing || !TTS.queue.length) return;
  TTS.playing = true;
  var text = TTS.queue.shift();
  fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ text: text }) })
    .then(function(r){ return r.ok ? r.blob() : Promise.reject(); })
    .then(function(blob){
      var audio = new Audio(URL.createObjectURL(blob));
      audio.onended = function(){ TTS.playing = false; ttsPump(); };
      audio.onerror = function(){ TTS.playing = false; ttsPump(); };
      audio.play().catch(function(){ TTS.playing = false; ttsPump(); });
    })
    .catch(function(){ TTS.playing = false; ttsPump(); });
}

function handleEvent(e){
  if (e.type === "snapshot"){
    $("pluginName").textContent = e.scenario || "—";
    (e.agents || []).forEach(function(a){ S.agents[a.id] = a; });
    S.alive = e.alive || null; S.sheriff = e.sheriff; S.revealed = e.revealed || [];
    S.sessionMetrics = e.metrics || {};
    S.reputation = e.reputation || {};
    (e.rounds || []).forEach(function(r){ S.roundMeta[r.id] = r; });
    renderMembers(); setState(e.state, e.winner);
    return;
  }
  if (e.type === "state"){
    S.alive = e.alive || S.alive; S.sheriff = e.sheriff; S.revealed = e.revealed || [];
    renderMembers(); return;
  }
  if (e.type === "round_start"){
    S.roundMeta[e.round.id] = e.round;
    var existing = S.rounds[e.round.id];
    if (existing){
      // 卡片先于 round_start 建出来（空标题）：补上
      var rt = existing.root.querySelector(".rt");
      var rs = existing.root.querySelector(".rs");
      if (rt && !rt.textContent) rt.textContent = e.round.title || "";
      if (rs && !rs.textContent) rs.textContent = e.round.subtitle || "";
    } else {
      createRound(e.round);
    }
    updateMetrics(); return;
  }
  if (e.type === "round_end"){
    var rd = S.rounds[e.round];
    if (rd) rd.summary.textContent = e.summary || "";
    scrollBottom(); return;
  }
  if (e.type === "message_start"){
    var m = e.message;
    if (S.msgs[m.id]) return;
    addMessage(m); updateMetrics(); return;
  }
  if (e.type === "delta"){
    var n = S.msgs[e.id];
    if (!n) return;
    if (e.field === "thinking"){
      n.think.textContent += e.text;
      n.thinkBox.style.display = "block";
      n.thinkBox.open = true;
    } else {
      n.text.textContent += e.text;
    }
    scrollBottom(); return;
  }
  if (e.type === "message_end"){
    var node = S.msgs[e.id];
    if (!node) return;
    finalize(node, e.text, e.thinking, e.meta);
    if (e.meta && e.meta.role && !node.root.querySelector(".role")){
      var who = node.root.querySelector(".who");
      if (who) who.insertAdjacentHTML("afterend", '<span class="role">' + esc(e.meta.role) + '</span>');
    }
    if (e.meta && e.meta.usage) node.usage = e.meta.usage;
    if (e.text){
      var who = "";
      if (node.root && node.root.querySelector(".who")){
        who = node.root.querySelector(".who").textContent;
      }
      ttsSay(e.text.indexOf("裁判") === 0 ? e.text : (who ? who + "：" + e.text : e.text));
    }
    if (e.meta && e.meta.ok === false && !node.failShown){
      var f = document.createElement("div");
      f.className = "fail";
      f.textContent = "调用失败：" + (e.meta.error || "未知错误");
      node.body.appendChild(f);
      node.failShown = true;
    }
    if (e.meta && e.meta.rejections && e.meta.rejections.length && !node.errShown){
      var err = document.createElement("div");
      err.className = "errline";
      err.textContent = "校验重说 " + e.meta.rejections.length + " 次：" + e.meta.rejections[0];
      node.body.appendChild(err);
      node.errShown = true;
    }
    updateMetrics(); scrollBottom(); return;
  }
  if (e.type === "turn"){
    if (e.state === "restart" && e.id && S.msgs[e.id]){
      S.msgs[e.id].text.textContent = "";
      S.msgs[e.id].think.textContent = "";
    }
    var a = S.agents[e.agent];
    $("typingHint").textContent = e.state === "start"
      ? ("正在等待 " + (a ? a.name : e.agent + " 号") + " 行动…") : "空闲";
    return;
  }
  if (e.type === "session"){
    setState(e.state, e.winner);
    $("typingHint").textContent = e.state === "ended" ? "对局已结束" : "空闲";
    return;
  }
}

/* ---------- 连接 ---------- */
function attach(sid){
  if (S.es){ S.es.close(); S.es = null; }
  S.cur = sid; S.msgs = {}; S.rounds = {}; S.roundMeta = {}; S.agents = {}; S.retry = 0; S.stick = true;
  $("stream").innerHTML = ""; banner(""); loadSessions();
  api("/api/sessions/" + encodeURIComponent(sid)).then(function(d){
    if (!d.ok){ replayLog(sid); return; }
    var es = new EventSource("/api/sessions/" + encodeURIComponent(sid) + "/stream");
    S.es = es;
    es.onmessage = function(ev){
      var data; try { data = JSON.parse(ev.data); } catch (err) { return; }
      S.retry = 0; banner(""); handleEvent(data);
    };
    es.onerror = function(){
      S.retry++;
      banner(S.retry >= 4 ? "连接中断：服务可能已重启，这一局已失效。"
                          : "连接中断，正在重连（第 " + S.retry + " 次）…");
    };
  });
}

function replayLog(sid){
  banner("会话已不在内存中，正在从日志回放…");
  api("/api/sessions/" + encodeURIComponent(sid) + "/log").then(function(d){
    if (!d.ok){ banner("没有找到这一局的日志。"); return; }
    banner("历史回放 · " + sid + "（只读，非实时）");
    var skip = { delta: 1, turn: 1, ping: 1 };
    // 老日志没有 meta 事件：用消息里的 sender 反推参与者
    (d.events || []).forEach(function(ev){
      if (ev.type !== "message_start") return;
      var m = ev.message || {};
      if (m.sender == null || S.agents[m.sender]) return;
      var meta = m.meta || {};
      S.agents[m.sender] = {id: m.sender, name: m.sender_name || (m.sender + " 号"),
                            model: meta.model || "", role: meta.role || ""};
    });
    (d.events || []).forEach(function(ev){
      if (skip[ev.type]) return;
      if (ev.type === "meta"){
        $("pluginName").textContent = ev.scenario || "—";
        (ev.agents || []).forEach(function(a){ S.agents[a.id] = a; });
        renderMembers();
        return;
      }
      handleEvent(ev);
    });
    updateMetrics();
    S.stick = true; scrollBottom(true);
  });
}

function loadReplay(){
  return api("/api/replay").then(function(d){
    var logs = (d.logs || []).slice(0, 12);
    $("replayList").innerHTML = logs.length ? logs.map(function(l){
      var kb = Math.max(1, Math.round((l.size || 0) / 1024));
      return '<button class="sess" data-log="' + esc(l.id) + '">' +
        '<div class="t">' + esc(l.id) + '</div>' +
        '<div class="s">' + kb + ' KB · 日志回放</div></button>';
    }).join("") : '<div class="hint">暂无日志</div>';
  });
}

function attachStatic(sid){
  S.cur = sid; S.msgs = {}; S.rounds = {}; S.roundMeta = {}; S.agents = {};
  $("stream").innerHTML = "";
  return api("/api/sessions/" + encodeURIComponent(sid)).then(function(d){
    if (!d.ok){ replayLog(sid); return; }
    var s = d.session;
    $("pluginName").textContent = s.scenario || "—";
    (s.agents || []).forEach(function(a){ S.agents[a.id] = a; });
    S.alive = s.alive || null; S.sheriff = s.sheriff; S.revealed = s.revealed || [];
    renderMembers(); setState(s.state, s.winner);
    var rounds = {};
    (s.rounds || []).forEach(function(r){ rounds[r.id] = r; });
    (s.messages || []).forEach(function(m){
      if (m.kind === "referee" || m.kind === "system"){ addReferee(m); return; }
      var rid = (m.meta && m.meta.round) || null;
      if (rid){
        S.roundMeta[rid] = rounds[rid] || S.roundMeta[rid] || { id: rid, title: "" };
        if (!S.rounds[rid] && KIND_BY_TITLE[S.roundMeta[rid].title]){
          S.roundMeta[rid] = Object.assign({}, S.roundMeta[rid], { kind: KIND_BY_TITLE[S.roundMeta[rid].title] });
        }
        ensureRound(rid);
      }
      var node = addItem(rid, m);
      finalize(node, m.text, m.thinking, m.meta);
      if (m.meta && m.meta.role && node && !node.root.querySelector(".role")){
        var who = node.root.querySelector(".who");
        if (who) who.insertAdjacentHTML("afterend", '<span class="role">' + esc(m.meta.role) + '</span>');
      }
    });
    (s.rounds || []).forEach(function(r){
      var rd = S.rounds[r.id];
      if (rd && r.summary) rd.summary.textContent = r.summary;
    });
    updateMetrics(); S.stick = true; scrollBottom(true);
  });
}

/* ---------- 会话列表 / 新建 ---------- */
function isBatchId(id){
  return /^b[0-9a-f]{8,}-/.test(String(id || ""));
}

function loadSessions(){
  return api("/api/sessions").then(function(d){
    S.sessions = d.sessions || [];
    var manual = S.sessions.filter(function(s){ return !isBatchId(s.id); });
    var batched = S.sessions.filter(function(s){ return isBatchId(s.id); });
    var list = S.showBatch ? S.sessions : manual;
    var head = batched.length
      ? '<button class="sess" id="batchToggle" style="width:100%;text-align:left">' +
        '<div class="s">批次对局 ' + batched.length + " 局 · " + (S.showBatch ? "点击隐藏" : "点击展开") + '</div></button>'
      : '';
    $("sessList").innerHTML = head + (list.length ? list.map(function(s){
      var live = s.state === "running";
      return '<div class="sesswrap">' +
        '<button class="sess' + (S.cur === s.id ? " on" : "") + '" data-id="' + esc(s.id) + '">' +
        '<div class="t">' + esc(s.title) + '</div>' +
        '<div class="s">' + esc(s.scenario) + ' · ' + s.messages + ' 条 · ' + esc(stateText(s.state)) +
        '</div></button>' +
        (live ? '<button class="stopbtn" data-stop="' + esc(s.id) + '" title="结束这局">结束</button>' : '') +
        (s.state === "paused" ? '<button class="stopbtn" data-resume="' + esc(s.id) + '" title="从那一步继续">继续</button>' : '') +
        '</div>';
    }).join("") : '<div class="hint">还没有会话</div>');
    var toggle = $("batchToggle");
    if (toggle){
      toggle.onclick = function(){ S.showBatch = !S.showBatch; loadSessions(); };
    }
  });
}
function loadPlugins(){
  return api("/api/plugins").then(function(d){ S.plugins = d.plugins || []; renderPluginOptions(); });
}
function loadModels(){
  return api("/api/models").then(function(d){ S.models = d.models || []; });
}
function currentPlugin(){
  var id = $("pluginSel").value;
  return S.plugins.filter(function(p){ return p.id === id; })[0];
}
function renderPluginOptions(){
  $("pluginSel").innerHTML = S.plugins.map(function(p){
    return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
  }).join("");
  renderConfig(); renderSeats(12);
}
function renderConfig(){
  var p = currentPlugin(); var box = $("configBox");
  if (!p || !p.default_config){ box.innerHTML = ""; return; }
  box.innerHTML = Object.keys(p.default_config).map(function(k){
    var v = p.default_config[k];
    var t = typeof v === "number" ? "number" : "text";
    return '<div><label>' + esc(k) + '</label><input data-cfg="' + esc(k) + '" type="' + t +
      '" value="' + esc(v) + '"></div>';
  }).join("");
}
function modelOptions(sel){
  if (!S.models.length) return '<option value="">（先添加模型）</option>';
  return S.models.map(function(m){
    return '<option value="' + esc(m.id) + '"' + (m.id === sel ? " selected" : "") + '>' +
      esc(m.name) + '</option>';
  }).join("");
}
function renderSeats(n){
  var box = $("seats");
  if (box.querySelectorAll("select").length === n) return;
  box.innerHTML = "";
  for (var i = 1; i <= n; i++){
    var d = document.createElement("div");
    d.className = "seatrow";
    var preset = S.models[(i - 1) % Math.max(1, S.models.length)];
    d.innerHTML = '<span class="hint">' + i + ' 号</span>' +
      '<select class="mdl">' + modelOptions(preset ? preset.id : "") + '</select>';
    box.appendChild(d);
  }
}
function openModal(){ $("modal").classList.add("show"); }
function closeModal(){ $("modal").classList.remove("show"); }
function startSession(){
  var p = currentPlugin();
  if (!p) return;
  var config = {};
  Array.prototype.forEach.call(document.querySelectorAll("[data-cfg]"), function(el){
    config[el.getAttribute("data-cfg")] = el.type === "number" ? Number(el.value) : el.value;
  });
  var seats = [];
  Array.prototype.forEach.call(document.querySelectorAll("#seats .mdl"), function(sel, i){
    seats.push({ model_id: sel.value, name: (i + 1) + "号" });
  });
  if (seats.some(function(s){ return !s.model_id; })){ alert("每个座位都要选模型"); return; }
  $("btnStart").disabled = true;
  api("/api/sessions", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ plugin:p.id, config:config, seats:seats,
                           title: $("titleInput").value || p.name })
  }).then(function(d){
    $("btnStart").disabled = false;
    if (!d.ok){ alert(d.error || "创建失败"); return; }
    closeModal(); attach(d.session.id);
  }).catch(function(){ $("btnStart").disabled = false; });
}

/* ---------- 绑定 ---------- */
$("stream").addEventListener("scroll", function(){ S.stick = nearBottom(); });
$("ttsBtn").onclick = function(){
  TTS.on = !TTS.on;
  try { localStorage.setItem("dsh-tts", TTS.on ? "1" : "0"); } catch (err) {}
  $("ttsBtn").textContent = "播报：" + (TTS.on ? "开" : "关");
};
ttsInit();
$("btnNew").onclick = openModal;
$("btnCancel").onclick = closeModal;
$("btnStart").onclick = startSession;
$("pluginSel").onchange = renderConfig;
$("btnAddSeat").onclick = function(){
  renderSeats(document.querySelectorAll("#seats .mdl").length + 1);
};
$("replayList").onclick = function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-log]") : null;
  if (!t) return;
  var id = t.getAttribute("data-log");
  S.cur = id; S.msgs = {}; S.rounds = {}; S.roundMeta = {}; S.agents = {};
  $("stream").innerHTML = "";
  replayLog(id);
  loadSessions();
};
$("sessList").onclick = function(ev){
  var resume = ev.target.closest ? ev.target.closest("[data-resume]") : null;
  if (resume){
    var rid = resume.getAttribute("data-resume");
    banner("正在从快照续跑…");
    api("/api/sessions/" + encodeURIComponent(rid) + "/resume", { method: "POST" })
      .then(function(d){
        if (!d.ok){ banner("续跑失败：这一局不是暂停状态。"); return; }
        attach(rid);
      });
    return;
  }
  var stop = ev.target.closest ? ev.target.closest("[data-stop]") : null;
  if (stop){
    var sid = stop.getAttribute("data-stop");
    if (!confirm("结束这局？当前进行中的回合会走完后停止。")) return;
    api("/api/sessions/" + encodeURIComponent(sid) + "/stop", { method: "POST" })
      .then(function(){ loadSessions(); });
    return;
  }
  var t = ev.target.closest ? ev.target.closest("[data-id]") : null;
  if (t) attach(t.getAttribute("data-id"));
};
loadPlugins().then(loadModels).then(loadSessions).then(loadReplay).then(function(){
  var q = new URLSearchParams(location.search);
  var want = q.get("session");
  if (want){ q.has("static") ? attachStatic(want) : attach(want); }
});
setInterval(function(){ if (!S.es) loadSessions(); }, 4000);
</script>
